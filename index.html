<style>
:root{--bg:#0d1230;--sf:#171d45;--tx:#eef0ff;--mu:#9aa3d6;--ac:#8b5cf6;--ac2:#38bdf8;--g:#2fbf71;--y:#e6b422;--x:#3a3f6a;--bd:#2a3170;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f5ff;--sf:#fff;--tx:#14173a;--mu:#5d6490;--ac:#6d3fe0;--ac2:#0a84c6;--x:#c9cce6;--bd:#d9dcf2;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Georgia,'Iowan Old Style',serif}
h1,h2,h3,button,nav,.btn,.k{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin:.2em 0 .3em;letter-spacing:-.02em}h2{margin:1.6em 0 .5em}a{color:var(--ac2)}
.w{max-width:1040px;margin:0 auto;padding:0 1rem}
header{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.8rem 0}
.logo{font-weight:800;font-size:1.3rem;color:var(--tx);text-decoration:none}.logo span{color:var(--ac)}
nav{flex:1;display:flex;gap:.2rem;flex-wrap:wrap}nav a{padding:.35rem .7rem;border-radius:9px;color:var(--mu);text-decoration:none;font-weight:700}nav a:hover{background:var(--sf);color:var(--tx)}
button,.btn{font-weight:700;font-size:1rem;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:.55rem 1.1rem;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff}button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:2rem;align-items:center;padding:1.5rem 0}
.case{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:1.4rem;transform:rotate(1.5deg);border-left:6px solid var(--ac)}.case small{color:var(--mu);font-family:system-ui}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:1rem 1.2rem;color:var(--tx);text-decoration:none;display:block}.card:hover{border-color:var(--ac)}.card p{margin:.2rem 0 0;color:var(--mu);font-size:.95rem}
.hud{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;font-family:system-ui;color:var(--mu);font-weight:700}
.prog{height:6px;background:var(--x);border-radius:9px;overflow:hidden;margin:.5rem 0 1rem}.prog b{display:block;height:100%;background:var(--ac);transition:width .3s}
.clues{background:var(--sf);border-radius:12px;padding:.8rem 1.2rem;margin-bottom:1rem}.clues p{margin:.3rem 0}
.bd{display:grid;gap:6px;justify-content:center;margin:1rem 0}.row{display:flex;gap:6px;justify-content:center}
.t{width:min(52px,calc((100vw - 2rem - 6px*var(--n))/var(--n)));aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--bd);border-radius:8px;font:800 clamp(1rem,4vw,1.6rem) system-ui;text-transform:uppercase}
.t.f{border-color:var(--ac)}.t.g{background:var(--g);border-color:var(--g);color:#fff;animation:fl .4s both}.t.y{background:var(--y);border-color:var(--y);color:#1a1a1a;animation:fl .4s both}.t.x{background:var(--x);border-color:var(--x);animation:fl .4s both}
@keyframes fl{from{transform:rotateX(90deg)}}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;max-width:520px;margin:0 auto}.kr{display:flex;gap:5px;width:100%;justify-content:center}
.k{flex:1;max-width:44px;height:50px;padding:0;font-size:.95rem;background:var(--sf)}.k.w2{max-width:70px;font-size:.75rem}.k.g{background:var(--g);color:#fff}.k.y{background:var(--y);color:#1a1a1a}.k.x{background:var(--x);opacity:.6}
.msg{text-align:center;min-height:1.6em;font-family:system-ui;font-weight:700}
.res{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:1.3rem;margin-top:1rem}
.ans{font:800 2rem system-ui;letter-spacing:.2em;color:var(--ac2)}
.prose{max-width:68ch}.stats{display:flex;gap:.6rem;flex-wrap:wrap;margin:.8rem 0}.stats div{background:var(--bg);border-radius:10px;padding:.5rem .9rem;font-family:system-ui}.stats b{display:block;font-size:1.3rem}
.bg{display:inline-block;background:var(--ac);color:#fff;border-radius:99px;padding:.1rem .7rem;margin:.2rem;font:700 .85rem system-ui}
details{background:var(--sf);border-radius:10px;padding:.6rem 1rem;margin:.5rem 0}summary{cursor:pointer;font-weight:700}
.ad{min-height:90px;margin:1.5rem 0;text-align:center}
footer{margin-top:3rem;padding:1.5rem 0;border-top:1px solid var(--bd);color:var(--mu);font-family:system-ui}footer a{margin-right:1rem}
#ck{position:fixed;inset:auto 0 0 0;background:var(--sf);border-top:1px solid var(--bd);padding:1rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center;z-index:9}#ck p{margin:0;flex:1;min-width:230px}
@media(max-width:760px){.hero{grid-template-columns:1fr}.case{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
// Fill in after AdSense approval. Empty client = no ads, no scripts, nothing shown.
const ADS={client:'',slots:{top:'',mid:'',below:''}};
// word|category|difficulty(1-3)|clue1|clue2|clue3
const RAW=`ELEPHANT|animals|1|I am the largest living land animal.|My nose works like a hand.|I am said never to forget.
PENGUIN|animals|1|I am a bird that cannot fly.|I swim in cold southern seas.|I look like I wear a tuxedo.
DOLPHIN|animals|2|I am a mammal that lives in the sea.|I find my way by sending out clicks.|I leap beside ships.
CHAMELEON|animals|3|My eyes move independently.|I am famous for changing my look.|My tongue can be longer than my body.
ROUTER|technology|2|I send data to the right place.|I usually sit beside a modem.|Your home Wi-Fi comes from me.
BROWSER|technology|1|You use me to visit websites.|Chrome and Firefox are my kind.|I turn code into pages.
PIXEL|technology|1|I am the smallest dot on a screen.|Millions of me form a photo.|My name means picture element.
ALGORITHM|technology|3|I am a set of steps that solves a problem.|A recipe is a distant cousin of mine.|Search engines rank pages using me.
GRAVITY|science|1|I keep your feet on the ground.|A falling apple helped Newton explain me.|I hold planets in orbit.
NEURON|science|2|I am a cell that carries signals.|Billions of me live in your brain.|I fire tiny electrical impulses.
PHOTON|science|3|I am a packet of light.|I have no mass.|I travel at the speed of light.
OXYGEN|science|1|I am a gas you breathe.|Plants release me.|My symbol is O.
CAMERA|movies|1|I capture moving pictures.|Filmmakers point me at actors.|I record every scene.
TRAILER|movies|1|I am a short preview of a film.|I play before the main feature.|I am all highlights, no ending.
SEQUEL|movies|2|I continue an earlier story.|Part two is my usual form.|Studios make me when the first one sells.
DIRECTOR|movies|2|I guide the actors on set.|I am the one who calls action.|I lead the creative vision of a film.
VOLCANO|geography|1|I can erupt.|I am a mountain with a crater.|Lava flows out of me.
DESERT|geography|1|I get very little rain.|The Sahara is the largest hot one.|Camels cross me.
EQUATOR|geography|2|I am an imaginary line.|I split Earth into two hemispheres.|I sit at zero degrees latitude.
ARCHIPELAGO|geography|3|I am a group of islands.|Indonesia and Japan are full of me.|I form a chain across the sea.
NOODLE|food|1|I am long and made from dough.|I am slurped from a bowl.|Ramen features me.
AVOCADO|food|2|I am a green fruit with one big stone.|Guacamole is made from me.|My flesh is creamy.
SAFFRON|food|3|I am among the priciest spices.|I come from crocus threads.|I turn rice golden.
PANCAKE|food|1|I am flat and served in stacks.|Maple syrup loves me.|I am flipped in a pan.
PYRAMID|history|1|Pharaohs were buried in me.|Giza has the most famous ones.|My sides are triangles.
CASTLE|history|1|Knights defended me.|I have towers and sometimes a moat.|Medieval lords lived in me.
EMPEROR|history|2|I rule an empire.|Caesar and Napoleon held my title.|I outrank a king.
RENAISSANCE|history|3|I am a rebirth of art and learning.|I began in Italy around the 1300s.|Leonardo and Michelangelo shaped me.
MARATHON|sports|2|I am a very long race.|I cover about 42 kilometres.|My name comes from a Greek battlefield.
GOALKEEPER|sports|2|I wear gloves in football.|I guard the net.|I am the only one allowed to handle the ball.
RACKET|sports|1|You swing me.|Tennis and badminton use me.|Strings are stretched across my frame.
OLYMPICS|sports|2|I happen every four years.|Five rings symbolise me.|Athletes compete in me for gold.
SHADOW|general|1|I can travel the world without moving.|I can be seen but never touched.|I appear when light meets an object.
MIRROR|general|1|I show you yourself.|I am glass with a silver backing.|I reflect.
COMPASS|general|2|I always point north.|Sailors trusted me.|A magnetic needle sits inside me.
LIBRARY|general|1|I lend books.|Silence is expected inside me.|Shelves fill my rooms.`;
const P=RAW.split('\n').map((l,i)=>{const a=l.split('|');return{i,w:a[0],c:a[1],d:+a[2],cl:a.slice(3)}});
const CATS=['animals','technology','science','movies','geography','food','history','sports','general'];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const MODES={daily:['Daily Mystery','One new mystery a day, the same for every player. Six attempts and three clues.','/daily'],infinite:['Infinite Detective','Unlimited mysteries that get harder as you keep solving.','/infinite'],time:['Time Attack','Solve as many mysteries as you can in three minutes.','/time-attack'],expert:['Expert Detective','Harder words, five attempts, one extra clue, bigger rewards.','/expert']};
const RANKS=[['Rookie Detective',0],['Junior Investigator',100],['Senior Detective',300],['Master Detective',700],['Chief Investigator',1500],['Legendary Detective',3000]];
const rank=x=>RANKS.filter(r=>x>=r[1]).pop()[0];
const GUIDE='Each mystery hides one word. Read the first clue, type a word of the right length and press Enter. Green means the right letter in the right place, yellow means the letter is in the word but elsewhere, and grey means it is not in the word. You can reveal extra clues, but each one lowers your score. You are never required to watch an ad or pay to continue. Guesses must be the right length and letters only: the game does not check a dictionary, so use your attempts wisely.';
const K='worddetective',td=()=>new Date().toISOString().slice(0,10);
let S=Object.assign({xp:0,streak:0,last:'',solved:0,played:0,ach:[],daily:null,m:{d:'',s:0,nh:0},best:{inf:0,time:0},theme:''},JSON.parse(localStorage.getItem(K)||'{}'));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),app=$('#app');
if(S.m.d!=td())S.m={d:td(),s:0,nh:0};
function theme(){document.documentElement.dataset.theme=S.theme||'dark'}thm.onclick=()=>{S.theme=S.theme=='light'?'dark':'light';save();theme()};theme();
function adSlot(n){if(!ADS.client||!ADS.slots[n]||S.consent!==true)return'';return`<div class="ad" aria-label="Advertisement"><ins class="adsbygoogle" style="display:block" data-ad-client="${ADS.client}" data-ad-slot="${ADS.slots[n]}" data-ad-format="auto" data-full-width-responsive="true"></ins></div>`}
function runAds(){if(!ADS.client||S.consent!==true)return;if(!window.__a){window.__a=1;const s=document.createElement('script');s.async=1;s.crossOrigin='anonymous';s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+ADS.client;document.head.append(s)}document.querySelectorAll('.adsbygoogle:not([data-d])').forEach(e=>{e.dataset.d=1;try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(x){}})}
if(S.consent===undefined)ck.hidden=false;ya.onclick=()=>{S.consent=true;save();ck.hidden=true;adh.innerHTML=adSlot('top');runAds()};na.onclick=()=>{S.consent=false;save();ck.hidden=true};
// ---- Engine
function fb(g,a){const r=Array(a.length).fill('x'),c={};[...a].forEach((ch,i)=>{if(g[i]==ch)r[i]='g';else c[ch]=(c[ch]||0)+1});[...g].forEach((ch,i)=>{if(r[i]!='g'&&c[ch]>0){r[i]='y';c[ch]--}});return r}
const dayN=()=>Math.floor(Date.now()/864e5),pickDaily=()=>P[dayN()%P.length];
let G=null,tm,live=false;
function begin(mode,cat){clearInterval(tm);G={mode,cat,tries:mode=='expert'?5:6,extra:mode=='expert'?1:2,score:0,sv:0,seen:[],win:0,left:180};if(mode=='time')tm=setInterval(()=>{G.left--;if(G.left<=0){clearInterval(tm);endTime()}else hud()},1000);load()}
function pick(){const m=G.mode;if(m=='daily')return pickDaily();let pool=P;if(m=='expert')pool=P.filter(p=>p.d>=2);if(m=='category')pool=P.filter(p=>p.c==G.cat);if(m=='infinite'){const t=Math.min(3,1+Math.floor(G.win/3));const q=P.filter(p=>p.d==t);if(q.length)pool=q}
 let f=pool.filter(p=>!G.seen.includes(p.i));if(!f.length){G.seen=[];f=pool}const p=f[Math.floor(Math.random()*f.length)];G.seen.push(p.i);return p}
function load(){G.p=pick();G.gs=[];G.cur='';G.hu=0;G.t=Date.now();G.done=false;live=true;frame()}
function frame(){const p=G.p;app.innerHTML=`<div class="prose" style="margin:0 auto;max-width:560px"><div class="hud"><span id="h1"></span><span id="h2"></span></div><div class="prog"><b id="pg"></b></div><div class="clues" id="cl"></div><div class="msg" id="ms" role="status"></div><div class="bd" id="bd" style="--n:${p.w.length}"></div><div class="kb" id="kb"></div><p style="text-align:center"><button id="hb"></button> ${G.mode=='infinite'||G.mode=='time'||G.mode=='category'?'<button id="sk">Skip</button>':''}</p></div><div id="rs"></div>`;
 hb.onclick=()=>{if(G.hu<G.extra&&!G.done){G.hu++;paint()}};if($('#sk'))sk.onclick=()=>{if(!G.done){finish(false,true)}};paint();hud()}
function hud(){if(!$('#h1'))return;const m=G.mode=='time'?`Time ${Math.floor(G.left/60)}:${String(G.left%60).padStart(2,'0')} · Solved ${G.sv}`:`Score ${G.score}`;h1.textContent=(G.mode=='category'?cap(G.cat):MODES[G.mode][0])+` · ${G.p.c==G.cat||G.mode!='category'?'Level '+G.p.d:''}`;h2.textContent=m}
function paint(){const p=G.p,L=p.w.length;cl.innerHTML=p.cl.slice(0,1+G.hu).map((c,i)=>`<p><b>Clue ${i+1}:</b> ${c}</p>`).join('')+`<p style="color:var(--mu);font-size:.9rem">Case: ${cap(p.c)}, ${L} letters</p>`;
 pg.style.width=(G.gs.length/G.tries*100)+'%';hb.textContent=G.hu<G.extra?`Reveal clue ${G.hu+2} (−25 pts)`:'No clues left';hb.disabled=G.hu>=G.extra||G.done;
 let h='';for(let r=0;r<G.tries;r++){h+='<div class="row">';const g=G.gs[r],isC=r==G.gs.length&&!G.done;for(let c=0;c<L;c++){const f=g?g.f[c]:'',ch=g?g.w[c]:isC?G.cur[c]||'':'';h+=`<div class="t ${f} ${isC&&G.cur[c]?'f':''}">${ch}</div>`}h+='</div>'}bd.innerHTML=h;
 const st={};G.gs.forEach(g=>[...g.w].forEach((ch,i)=>{const v=g.f[i];if(v=='g'||(v=='y'&&st[ch]!='g')||(v=='x'&&!st[ch]))st[ch]=v}));
 kb.innerHTML=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].map((r,ri)=>`<div class="kr">${ri==2?'<button class="k w2" data-k="ENTER">Enter</button>':''}${[...r].map(c=>`<button class="k ${st[c]||''}" data-k="${c}">${c}</button>`).join('')}${ri==2?'<button class="k w2" data-k="BACKSPACE" aria-label="Delete">⌫</button>':''}</div>`).join('');
 kb.querySelectorAll('button').forEach(b=>b.onclick=()=>key(b.dataset.k))}
function say(t){if($('#ms'))ms.textContent=t}
function key(k){if(!G||G.done||!live)return;const L=G.p.w.length;if(k=='BACKSPACE')G.cur=G.cur.slice(0,-1);else if(k=='ENTER'){if(G.cur.length<L)return say(`Need ${L} letters.`);const w=G.cur,f=fb(w,G.p.w);G.gs.push({w,f});G.cur='';say('');if(w==G.p.w){paint();return finish(true)}if(G.gs.length>=G.tries){paint();return finish(false)}}else if(/^[A-Z]$/.test(k)&&G.cur.length<L)G.cur+=k;paint()}
addEventListener('keydown',e=>{if(!live||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toUpperCase();if(k=='ENTER'&&e.target.tagName=='BUTTON')return;if(k=='ENTER'||k=='BACKSPACE'||/^[A-Z]$/.test(k)){e.preventDefault();key(k)}});
function finish(win,skipped){G.done=true;const p=G.p,secs=Math.floor((Date.now()-G.t)/1000),n=G.gs.length;
 let sc=win?Math.max(10,p.d*100+(G.tries-n)*20+Math.max(0,60-secs)-G.hu*25)*(G.mode=='expert'?1.5:1):0;sc=Math.round(sc);const xp=Math.round(sc/4);
 G.score+=sc;if(win){G.sv++;G.win++}else G.win=0;
 S.played++;if(win){S.solved++;S.xp+=xp;S.m.s++;if(!G.hu)S.m.nh++}
 const add=(id,c)=>{if(c&&!S.ach.includes(id))S.ach.push(id)};add('First case solved',win);add('No clues needed',win&&!G.hu);add('Quick thinker (under 30s)',win&&secs<30);add('10 cases solved',S.solved>=10);add('Perfect guess (1 attempt)',win&&n==1);
 if(G.mode=='daily'&&!S.daily?.win&&S.daily?.d!=td()||G.mode=='daily'&&S.daily?.d!=td()){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(win)S.streak=S.last==y?S.streak+1:1;else S.streak=0;if(win)S.last=td();S.daily={d:td(),win,sc,n,f:G.gs.map(g=>g.f.join(''))};add('3-day streak',S.streak>=3)}
 if(G.mode=='infinite')S.best.inf=Math.max(S.best.inf,G.score);save();
 if(G.mode=='time'){say(win?`Solved! +${sc}`:`Skipped. The word was ${p.w}.`);hud();return setTimeout(()=>{if(G.left>0)load()},win?800:1600)}
 if(!win&&!skipped)say('');showRes(win,sc,xp,secs)}
function shareText(){const d=S.daily;return`Word Detective ${d.d} ${d.win?d.n:'X'}/6\n`+d.f.map(r=>[...r].map(c=>({g:'🟩',y:'🟨',x:'⬛'})[c]).join('')).join('\n')+'\n'+location.origin+'/daily'}
function showRes(win,sc,xp,secs){const p=G.p,d=G.mode=='daily';rs.innerHTML=`<div class="res" style="max-width:560px;margin:1rem auto"><h2 style="margin-top:0">${win?'Case solved':'Case unsolved'}</h2><div class="ans">${p.w}</div><p>${p.cl.join(' ')}</p><div class="stats"><div><b>${sc}</b>Score</div><div><b>+${win?xp:0}</b>XP</div><div><b>${secs}s</b>Time</div><div><b>${rank(S.xp)}</b>Rank (${S.xp} XP)</div></div><p>${d?'Streak: '+S.streak+' day(s). ':''}Mission today: solve 2 mysteries (${Math.min(2,S.m.s)}/2) · solve one without clues (${Math.min(1,S.m.nh)}/1)</p>${d?'<button class="p" id="sh">Share result</button> ':'<button class="p" id="nx">Next mystery</button> '}<a class="btn" href="/" data-l>Home</a><span id="sm" role="status"></span></div>${adSlot('below')}`;runAds();
 if(d)sh.onclick=async()=>{try{navigator.share?await navigator.share({text:shareText()}):(await navigator.clipboard.writeText(shareText()),sm.textContent=' Copied.')}catch(e){}};else nx.onclick=load;rs.scrollIntoView({behavior:'smooth',block:'nearest'})}
function endTime(){live=false;S.best.time=Math.max(S.best.time,G.score);S.xp+=0;save();app.innerHTML=`<div class="res"><h1>Time's up</h1><div class="stats"><div><b>${G.sv}</b>Solved</div><div><b>${G.score}</b>Score</div><div><b>${S.best.time}</b>Best on this device</div></div><button class="p" id="ag">Play again</button> <a class="btn" href="/" data-l>Home</a></div>${adSlot('below')}`;runAds();ag.onclick=()=>begin('time')}
// ---- Pages
const intro=(t,d,btn,extra='')=>`<h1>${t}</h1><p class="prose">${d}</p>${extra}<button class="p" id="go">${btn}</button>${adSlot('mid')}<div class="prose"><h2>How to play</h2><p>${GUIDE}</p></div>`;
const modeCards=()=>Object.values(MODES).map(m=>`<a class="card" href="${m[2]}" data-l><h3>${m[0]}</h3><p>${m[1]}</p></a>`).join('')+`<a class="card" href="/categories" data-l><h3>Category Mysteries</h3><p>Nine themes, from animals to history.</p></a>`;
const legal=(t,b)=>`<div class="prose"><h1>${t}</h1>${b}</div>`;
const STATIC={'/about':['About Word Detective',legal('About Word Detective','<p>Word Detective is an independent word puzzle. Every mystery is written by hand with three clues, so there are no machine-generated nonsense words. We never put ads on top of the game board and never require them to continue.</p>')],
'/contact':['Contact',legal('Contact','<p>Feedback or puzzle suggestions: <a href="mailto:hello@worddetective.example">hello@worddetective.example</a> (replace with your real address before launch).</p>')],
'/privacy':['Privacy Policy',legal('Privacy Policy','<p>No account is needed. Progress, XP and settings stay in your browser\'s local storage and are not sent to us. If ads are enabled, Google and partners may use cookies, but only after you accept the cookie notice. Replace this with a policy reviewed for your jurisdiction before launch.</p>')],
'/terms':['Terms and Conditions',legal('Terms and Conditions','<p>Use the site lawfully and do not tamper with the game. It is provided as is. Have these terms reviewed before launch.</p>')],
'/disclaimer':['Disclaimer',legal('Disclaimer','<p>Word Detective is for entertainment and vocabulary practice. It makes no health or educational claims. Third-party ads, when enabled, are not endorsements.</p>')],
'/how-to-play':['How to Play Word Detective',`<div class="prose"><h1>How to play</h1><p>${GUIDE}</p><h2>Scoring</h2><p>You earn points for difficulty, unused attempts and speed, minus 25 per extra clue. Expert mysteries pay 1.5 times. Points convert to XP, which raises your detective rank from Rookie to Legendary.</p><h2>Tips</h2><p>Start with a word that uses common letters in the clue's theme. Use yellow tiles to rearrange rather than repeat. Reveal a clue only when your attempts are running low.</p></div>`]};
function home(){const t=pickDaily(),dn=S.daily?.d==td();return[ 'Word Detective – Free Word Guessing Game & Daily Word Puzzle',`<section class="hero"><div><h1>Crack the word. Solve the mystery.</h1><p class="prose">A free detective word puzzle. Read the clues, guess the word and rank up. No sign-up and no paywall.</p><a class="btn p" href="/daily" data-l>${dn?'View today\'s result':'Start Investigation'}</a></div><div class="case"><small>Today's case · ${cap(t.c)} · ${t.w.length} letters</small><p style="font-size:1.2rem;margin:.6rem 0 0">“${t.cl[0]}”</p></div></section>${adSlot('mid')}<h2>Game modes</h2><div class="grid">${modeCards()}</div><h2>Your progress</h2><div class="stats"><div><b>${rank(S.xp)}</b>${S.xp} XP</div><div><b>${S.streak}</b>Day streak</div><div><b>${S.solved}</b>Cases solved</div></div><p>${S.ach.map(a=>`<span class="bg">${a}</span>`).join('')||'Solve a case to earn your first achievement.'}</p><h2>Popular categories</h2><div class="grid">${['animals','science','food','history'].map(c=>`<a class="card" href="/category/${c}" data-l><h3>${cap(c)}</h3></a>`).join('')}</div><h2>How to play</h2><p class="prose">${GUIDE}</p><h2>FAQ</h2><details><summary>Is Word Detective free?</summary><p>Yes. Every mode is free and needs no account.</p></details><details><summary>Is the daily mystery the same for everyone?</summary><p>Yes. It changes each day at midnight UTC.</p></details><details><summary>Where is my progress saved?</summary><p>In this browser only. Clearing site data resets it.</p></details>`]}
function render(p){let m=p.match(/^\/category\/(\w+)$/),page,mode=null,cat;
 if(p=='/')page=home();else if(p=='/daily'){const d=S.daily;if(d?.d==td()){page=['Daily Word Puzzle',`<h1>Daily Mystery</h1><div class="res"><h2 style="margin-top:0">${d.win?'Solved today':'Not solved today'}</h2><div class="stats"><div><b>${d.sc}</b>Score</div><div><b>${S.streak}</b>Streak</div></div><p>Come back tomorrow for a new case. Want more? Try <a href="/infinite" data-l>Infinite Detective</a>.</p><button class="p" id="sh">Share result</button> <span id="sm"></span></div>${adSlot('below')}`];window.__sh=1}else{mode='daily';page=['Daily Word Puzzle – Guess the Mystery Word',intro('Daily Mystery',MODES.daily[1],'Start Investigation',`<p>Streak: ${S.streak}</p>`)]}}
 else if(p=='/infinite'){mode='infinite';page=['Infinite Detective – Free Word Guessing Game',intro('Infinite Detective',MODES.infinite[1],'Start Investigation',`<p>Best streak score: ${S.best.inf}</p>`)]}
 else if(p=='/time-attack'){mode='time';page=['Time Attack Word Game – 3 Minute Challenge',intro('Time Attack',MODES.time[1],'Start the clock',`<p>Best on this device: ${S.best.time}</p>`)]}
 else if(p=='/expert'){mode='expert';page=['Expert Word Detective – Hard Word Puzzle',intro('Expert Detective',MODES.expert[1],'Start Investigation')]}
 else if(p=='/categories')page=['Category Word Games – Animals, Science, Food & More',`<h1>Category mysteries</h1><div class="grid">${CATS.map(c=>`<a class="card" href="/category/${c}" data-l><h3>${cap(c)}</h3><p>${P.filter(x=>x.c==c).length} hand-written cases</p></a>`).join('')}</div>${adSlot('mid')}`];
 else if(m&&CATS.includes(m[1])){mode='category';cat=m[1];page=[cap(cat)+' Word Game – Guess the Mystery Word',intro(cap(cat)+' Mysteries',`Cases themed around ${cat}. Same rules, new clues.`,'Start Investigation')]}
 else page=STATIC[p]||home();
 document.title=page[0];app.innerHTML=page[1];adh.innerHTML=adSlot('top');live=false;clearInterval(tm);scrollTo(0,0);
 if(mode&&$('#go'))go.onclick=()=>begin(mode,cat);if(window.__sh&&$('#sh')){window.__sh=0;sh.onclick=async()=>{try{navigator.share?await navigator.share({text:shareText()}):(await navigator.clipboard.writeText(shareText()),sm.textContent='Copied.')}catch(e){}}}
 const c=document.querySelector('link[rel=canonical]');c.href=location.origin+p;runAds()}
const go_=u=>{history.pushState(0,'',u);render(u)};
document.addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(a){e.preventDefault();go_(a.getAttribute('href'))}});
addEventListener('popstate',()=>render(location.pathname.replace(/\/+$/,'')||'/'));render(location.pathname.replace(/\/+$/,'')||'/');
</script>
</body>
</html>
